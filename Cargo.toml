[workspace]
resolver = "3"
members = [".", "crates/*", "examples/*"]

[package]
name = "conflaguration"
version = "2.0.0"
edition = "2024"
description = "typed settings structs from environment variables"
license = "MIT"
repository = "https://github.com/brianbruggeman/conflaguration"
keywords = ["env", "settings", "config", "derive", "configuration"]
categories = ["config"]

[dependencies]
environs = { version = "1.2.0", optional = true }
thiserror = { version = "2", optional = true }
conflaguration-derive = { version = "2.0.0", path = "crates/conflaguration-derive", optional = true }
serde = { version = "1", optional = true }
toml = { version = "0.8", optional = true }
serde_json = { version = "1", optional = true }
serde_yaml = { version = "0.9", optional = true }
serde-value = { version = "0.7.0", optional = true }
conflaguration-core = { version = "0.1.0", path = "crates/conflaguration-core" }

[lints.rust]
warnings = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dev-dependencies]
config = { version = "0.15", features = ["toml"] }
divan = "0.1.21"
envy = "0.4"
figment = { version = "0.10", features = ["toml"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
temp-env = "0.3.6"
tempfile = "3.25.0"
trybuild = "1.0.116"

[[bench]]
name = "bench_conflaguration"
harness = false
required-features = ["derive", "toml", "json"]

# no required-features: cargo never skips this one, so a flagless `cargo
# bench` cannot silently exit 0 while `bench_conflaguration` above is skipped
# for missing features.
[[bench]]
name = "bench_guard"
harness = false

[features]
derive = ["dep:conflaguration-derive"]
# build-script helpers (codegen module); pair with #[derive(ConfigCodegen)].
codegen = []
# serde-value is the format-neutral merge medium for layered file overlay
# (ConfigBuilder::file); serde_json is only pulled where json is actually parsed.
toml = ["dep:serde", "dep:toml", "dep:serde-value"]
json = ["dep:serde", "dep:serde_json", "dep:serde-value"]
yaml = ["dep:serde", "dep:serde_yaml", "dep:serde-value"]
std = ["dep:environs", "dep:thiserror"]
default = ["std"]
alloc = ["conflaguration-core/alloc"]
