[package]
name = "conflaguration-core"
version = "0.1.0"
edition = "2024"
description = "borrowed no-std settings core for conflaguration"
license = "MIT"
repository = "https://github.com/brianbruggeman/conflaguration"
keywords = ["env", "settings", "config", "no-std", "configuration"]
categories = ["config", "no-std"]

[dev-dependencies]
conflaguration = { path = "../..", features = ["derive", "json"] }
conflaguration-derive = { path = "../conflaguration-derive" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
temp-env = "0.3.6"
tempfile = "3.25.0"

[features]
alloc = []
